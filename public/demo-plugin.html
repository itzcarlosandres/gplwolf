<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo en Vivo - Marketplace Connect Redesign</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS (Matches the WP Plugin's current Tailwind configuration) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: '#FF2121',
                        secondary: '#F51B1B',
                        accent: '#fbbf24',
                        darkBg: '#09090b',
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        /* Bauhaus custom styling tweaks */
        .bauhaus-card {
            border: 3px solid #1c1c22 !important;
            background: #09090b !important;
            border-radius: 0px !important;
            box-shadow: 6px 6px 0px #1c1c22 !important;
            transition: all 0.2s ease-in-out;
        }
        .bauhaus-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0px #FF2121 !important;
            border-color: #FF2121 !important;
        }
        .bauhaus-button {
            border: 2px solid #1c1c22 !important;
            border-radius: 0px !important;
            box-shadow: 3px 3px 0px #1c1c22 !important;
        }
        .bauhaus-button:hover {
            box-shadow: 0px 0px 0px #1c1c22 !important;
            transform: translate(2px, 2px);
        }
    </style>
</head>
<body class="bg-[#050505] text-gray-300 antialiased selection:bg-red-600/30 selection:text-white" x-data="pluginDemo()">

    <!-- Toast Notifications -->
    <div class="fixed top-8 right-8 z-[9999] space-y-3 pointer-events-none max-w-sm">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="translate-y-2 opacity-0 scale-95"
                 x-transition:enter-end="translate-y-0 opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 class="p-4 bg-zinc-900 border border-white/10 rounded-2xl shadow-2xl flex items-center gap-3 pointer-events-auto">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm shrink-0"
                     :class="toast.type === 'success' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'">
                    <i class="fas" :class="toast.type === 'success' ? 'fa-check-circle' : 'fa-info-circle'"></i>
                </div>
                <div>
                    <p class="text-white text-xs font-bold" x-text="toast.message"></p>
                </div>
            </div>
        </template>
    </div>

    <div class="max-w-6xl mx-auto p-8">
        <!-- Back Link & Banner -->
        <div class="mb-8 flex justify-between items-center">
            <a href="http://localhost/gplwolf/public/licencias" class="text-xs uppercase tracking-widest font-black text-gray-500 hover:text-white flex items-center gap-2 transition-colors">
                <i class="fas fa-arrow-left text-[9px]"></i> Regresar a GPLWolf
            </a>
            <span class="px-3 py-1 bg-primary/10 border border-primary/20 text-primary text-[10px] font-black uppercase tracking-widest rounded-full">
                Modo Demo Interactivo
            </span>
        </div>

        <!-- WordPress Admin Frame Simulation -->
        <div class="bg-darkBg rounded-[32px] border border-white/5 p-6 md:p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-80 h-80 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>

            <!-- Dashboard Header -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 border-b border-white/5 pb-6 mb-8">
                <div>
                    <h1 class="text-white text-3xl font-black tracking-tight leading-none flex items-center gap-3">
                        <i class="fas fa-cubes text-primary"></i> Marketplace Connect
                    </h1>
                    <p class="text-gray-500 text-xs mt-2 font-medium">Instala y actualiza tus temas y plugins premium en un solo clic.</p>
                </div>

                <!-- Stats Bar -->
                <div class="flex items-center gap-6 bg-zinc-950/40 border border-white/5 px-6 py-3 rounded-2xl">
                    <div>
                        <span class="text-[9px] font-bold text-gray-500 uppercase tracking-widest block">Descargas Hoy</span>
                        <span class="text-white font-mono text-sm font-black">12 / 100</span>
                    </div>
                    <div class="w-px h-8 bg-white/5"></div>
                    <div>
                        <span class="text-[9px] font-bold text-gray-500 uppercase tracking-widest block">Conexiones</span>
                        <span class="text-white font-mono text-sm font-black">2 / 5 Sitios</span>
                    </div>
                </div>
            </div>

            <!-- Filters & Layout Controls Bar -->
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6 mb-8 bg-zinc-950/30 border border-white/5 p-4 rounded-2xl">
                <!-- Search & Filters -->
                <div class="flex flex-wrap items-center gap-3">
                    <!-- Search input -->
                    <div class="relative w-full sm:w-64">
                        <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-xs"></i>
                        <input type="text" x-model="searchQuery" placeholder="Buscar plugin o theme..." class="w-full bg-[#050505] border border-white/10 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all">
                    </div>

                    <!-- Category Tabs -->
                    <div class="flex items-center bg-[#050505] border border-white/10 p-1 rounded-xl">
                        <button @click="filterTab = 'all'" :class="filterTab === 'all' ? 'bg-primary text-white' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all">
                            Todos
                        </button>
                        <button @click="filterTab = 'licenses'" :class="filterTab === 'licenses' ? 'bg-amber-500 text-black' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all flex items-center gap-1">
                            🔑 Licencias
                        </button>
                        <button @click="filterTab = 'news'" :class="filterTab === 'news' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all flex items-center gap-1">
                            ✨ Nuevos
                        </button>
                        <button @click="filterTab = 'plugins'" :class="filterTab === 'plugins' ? 'bg-zinc-800 text-white' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all">
                            Plugins
                        </button>
                        <button @click="filterTab = 'themes'" :class="filterTab === 'themes' ? 'bg-zinc-800 text-white' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all">
                            Themes
                        </button>
                    </div>
                </div>

                <!-- Layout Mode Selector -->
                <div class="flex items-center gap-2 bg-[#050505] border border-white/10 p-1 rounded-xl shrink-0 self-end lg:self-auto">
                    <span class="text-[9px] font-bold text-gray-500 uppercase tracking-widest px-2.5">Diseño:</span>
                    <button @click="layoutMode = 'grid'" :class="layoutMode === 'grid' ? 'bg-zinc-800 text-white border border-white/10' : 'text-gray-500 hover:text-white'" class="p-2 rounded-lg text-xs transition-all" title="Modo Rejilla">
                        <i class="fas fa-th-large"></i> Grid
                    </button>
                    <button @click="layoutMode = 'list'" :class="layoutMode === 'list' ? 'bg-zinc-800 text-white border border-white/10' : 'text-gray-500 hover:text-white'" class="p-2 rounded-lg text-xs transition-all" title="Modo Lista">
                        <i class="fas fa-list"></i> List
                    </button>
                    <button @click="layoutMode = 'compact'" :class="layoutMode === 'compact' ? 'bg-zinc-800 text-white border border-white/10' : 'text-gray-500 hover:text-white'" class="p-2 rounded-lg text-xs transition-all" title="Modo Compacto">
                        <i class="fas fa-align-justify"></i> Compact
                    </button>
                    <button @click="layoutMode = 'bauhaus'" :class="layoutMode === 'bauhaus' ? 'bg-zinc-800 text-white border border-white/10' : 'text-gray-500 hover:text-white'" class="p-2 rounded-lg text-xs transition-all flex items-center gap-1 font-bold" title="Modo Bauhaus">
                        <i class="fas fa-palette"></i> Bauhaus
                    </button>
                </div>
            </div>

            <!-- Products List Area -->
            <div class="min-h-[400px]">
                
                <!-- 1. Grid Mode -->
                <div x-show="layoutMode === 'grid'" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" x-transition>
                    <template x-for="product in filteredProducts()" :key="product.id">
                        <div class="bg-zinc-950/40 border border-white/5 hover:border-primary/30 rounded-2xl overflow-hidden flex flex-col justify-between transition-all duration-300 hover:shadow-[0_8px_30px_rgba(255,33,33,0.03)] p-5">
                            <div>
                                <!-- Image with labels -->
                                <div class="relative w-full aspect-video rounded-xl bg-zinc-900 border border-white/5 overflow-hidden mb-4 flex items-center justify-center">
                                    <img :src="product.image" class="w-full h-full object-cover">
                                    <span class="absolute top-2 right-2 text-[8px] font-black uppercase bg-zinc-950/80 px-2 py-0.5 rounded border border-white/10 text-primary tracking-widest" x-text="product.type"></span>
                                    
                                    <!-- Badges -->
                                    <div class="absolute top-2 left-2 flex flex-col gap-1">
                                        <template x-if="product.is_license">
                                            <span class="text-[8px] font-black uppercase bg-amber-500 text-black px-2 py-0.5 rounded shadow">🔑 Licencia</span>
                                        </template>
                                        <template x-if="product.is_new">
                                            <span class="text-[8px] font-black uppercase bg-blue-600 text-white px-2 py-0.5 rounded shadow">✨ Nuevo</span>
                                        </template>
                                    </div>
                                </div>

                                <div class="flex items-center justify-between gap-4 mb-2">
                                    <h3 class="text-white font-bold text-base truncate" x-text="product.name"></h3>
                                    <span class="text-[9px] px-2 py-0.5 bg-white/5 border border-white/10 text-gray-400 rounded-md font-mono shrink-0" x-text="'v' + product.version"></span>
                                </div>
                                <p class="text-gray-500 text-xs leading-relaxed mb-4 line-clamp-2" x-text="product.desc"></p>
                            </div>

                            <div>
                                <!-- License Box -->
                                <template x-if="product.is_license">
                                    <div class="mb-4 p-3 bg-amber-500/5 border border-amber-500/10 rounded-xl flex flex-col gap-2">
                                        <span class="text-[9px] font-bold text-amber-400 flex items-center gap-1">
                                            <i class="fas fa-key text-[8px]"></i> Requiere activación por ticket
                                        </span>
                                        <a href="#" @click.prevent="toast('redirection', 'Abriendo pestaña de tickets...')" class="py-1.5 bg-amber-500 hover:bg-amber-600 text-black text-[9px] font-black uppercase tracking-wider rounded-lg text-center transition-all block">
                                            Solicitar Llave <i class="fas fa-external-link-alt text-[8px] ml-0.5"></i>
                                        </a>
                                    </div>
                                </template>

                                <!-- Action Buttons -->
                                <div class="flex gap-2">
                                    <button @click="install(product)" :disabled="product.installing || product.installed" :class="product.installed ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-primary hover:bg-secondary text-white'" class="flex-1 py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-all">
                                        <i class="fas" :class="product.installed ? 'fa-check' : (product.installing ? 'fa-sync animate-spin' : 'fa-download')"></i>
                                        <span x-text="product.installed ? '¡Instalado!' : (product.installing ? 'Instalando...' : 'Instalar en WP')"></span>
                                    </button>
                                    <button @click="downloadZip(product)" class="px-3 bg-white/5 border border-white/10 hover:bg-white/10 text-white rounded-xl transition-all" title="Descargar ZIP Directo">
                                        <i class="fas fa-file-zipper text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- 2. List Mode -->
                <div x-show="layoutMode === 'list'" class="space-y-4" x-transition>
                    <template x-for="product in filteredProducts()" :key="product.id">
                        <div class="bg-zinc-950/40 border border-white/5 hover:border-primary/20 rounded-2xl p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-6 transition-all duration-300">
                            <!-- Left Block: Image & Meta -->
                            <div class="flex items-center gap-4 w-full md:w-3/5">
                                <div class="w-16 h-16 rounded-xl overflow-hidden bg-zinc-900 border border-white/5 shrink-0 relative">
                                    <img :src="product.image" class="w-full h-full object-cover">
                                    <span class="absolute bottom-1 right-1 text-[7px] font-black uppercase bg-zinc-950/80 px-1 py-0.5 rounded text-primary tracking-wider" x-text="product.type"></span>
                                </div>
                                <div class="min-w-0">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <h4 class="text-white font-bold text-sm truncate" x-text="product.name"></h4>
                                        <span class="text-[9px] px-1.5 py-0.2 bg-white/5 text-gray-500 rounded border border-white/10 font-mono" x-text="'v' + product.version"></span>
                                        <div class="flex gap-1">
                                            <template x-if="product.is_license">
                                                <span class="text-[7px] font-black uppercase bg-amber-500 text-black px-1 py-0.5 rounded">🔑 Licencia</span>
                                            </template>
                                            <template x-if="product.is_new">
                                                <span class="text-[7px] font-black uppercase bg-blue-600 text-white px-1 py-0.5 rounded">✨ Nuevo</span>
                                            </template>
                                        </div>
                                    </div>
                                    <p class="text-gray-500 text-xs mt-1 truncate" x-text="product.desc"></p>
                                </div>
                            </div>

                            <!-- Right Block: Buttons / License Activation -->
                            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto shrink-0 md:justify-end">
                                <!-- License link -->
                                <template x-if="product.is_license">
                                    <a href="#" @click.prevent="toast('redirection', 'Abriendo pestaña de tickets...')" class="px-3 py-2 bg-amber-500/10 border border-amber-500/20 text-amber-500 hover:bg-amber-500 hover:text-black rounded-xl text-[10px] font-black uppercase tracking-wider transition-all">
                                        🔑 Solicitar Clave
                                    </a>
                                </template>

                                <!-- standard install -->
                                <button @click="install(product)" :disabled="product.installing || product.installed" :class="product.installed ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-primary hover:bg-secondary text-white'" class="px-5 py-2.5 rounded-xl font-bold text-xs flex items-center gap-1.5 transition-all w-full sm:w-auto justify-center">
                                    <i class="fas" :class="product.installed ? 'fa-check' : (product.installing ? 'fa-sync animate-spin' : 'fa-download')"></i>
                                    <span x-text="product.installed ? '¡Instalado!' : (product.installing ? 'Instalando...' : 'Instalar en WP')"></span>
                                </button>
                                <button @click="downloadZip(product)" class="p-2.5 bg-white/5 border border-white/10 hover:bg-white/10 text-white rounded-xl transition-all" title="Descargar ZIP">
                                    <i class="fas fa-file-zipper text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- 3. Compact Mode -->
                <div x-show="layoutMode === 'compact'" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" x-transition>
                    <template x-for="product in filteredProducts()" :key="product.id">
                        <div class="bg-zinc-950/40 border border-white/5 hover:border-primary/10 rounded-xl p-3 flex flex-col justify-between transition-all duration-300">
                            <div class="min-w-0">
                                <div class="flex items-center justify-between gap-2 mb-1.5">
                                    <span class="text-[8px] font-black uppercase tracking-wider text-gray-500" x-text="product.type"></span>
                                    <div class="flex gap-0.5">
                                        <template x-if="product.is_license">
                                            <span class="text-[6px] font-black bg-amber-500 text-black px-1 rounded">🔑</span>
                                        </template>
                                        <template x-if="product.is_new">
                                            <span class="text-[6px] font-black bg-blue-600 text-white px-1 rounded">✨</span>
                                        </template>
                                    </div>
                                </div>
                                <h4 class="text-white font-bold text-xs truncate mb-1" :title="product.name" x-text="product.name"></h4>
                                <span class="text-[8px] text-gray-600 font-mono block mb-3" x-text="'v' + product.version"></span>
                            </div>

                            <div class="flex items-center justify-between gap-2 border-t border-white/5 pt-2">
                                <template x-if="product.is_license">
                                    <a href="#" @click.prevent="toast('redirection', 'Abriendo pestaña de tickets...')" class="text-[9px] font-black text-amber-500 hover:text-amber-400 transition-colors" title="Solicitar clave de activación">
                                        🔑 Clave
                                    </a>
                                </template>
                                <template x-if="!product.is_license">
                                    <span class="text-[8px] text-gray-600">GPL Regular</span>
                                </template>

                                <div class="flex items-center gap-1.5">
                                    <button @click="install(product)" :disabled="product.installing || product.installed" :class="product.installed ? 'text-emerald-400 bg-emerald-500/10' : 'text-primary bg-primary/10 hover:bg-primary/20'" class="w-7 h-7 rounded-lg flex items-center justify-center transition-all text-xs">
                                        <i class="fas" :class="product.installed ? 'fa-check' : (product.installing ? 'fa-sync animate-spin' : 'fa-arrow-down')"></i>
                                    </button>
                                    <button @click="downloadZip(product)" class="w-7 h-7 text-gray-400 hover:text-white bg-white/5 rounded-lg flex items-center justify-center transition-all text-xs" title="Descargar ZIP">
                                        <i class="fas fa-file-zipper"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- 4. Bauhaus Mode -->
                <div x-show="layoutMode === 'bauhaus'" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" x-transition>
                    <template x-for="product in filteredProducts()" :key="product.id">
                        <div class="bauhaus-card p-6 flex flex-col justify-between">
                            <div>
                                <!-- Image & flat badges -->
                                <div class="relative w-full aspect-video bg-[#000] border-2 border-[#1c1c22] overflow-hidden mb-5">
                                    <img :src="product.image" class="w-full h-full object-cover">
                                    
                                    <span class="absolute top-2 right-2 text-[8px] font-black uppercase bg-[#1c1c22] px-2 py-0.5 text-white tracking-widest border border-white/10" x-text="product.type"></span>
                                    
                                    <!-- Left layout flat badges -->
                                    <div class="absolute top-2 left-2 flex flex-col gap-1.5">
                                        <template x-if="product.is_license">
                                            <span class="text-[8px] font-black uppercase bg-amber-500 text-black px-2 py-0.5 border border-[#1c1c22] shadow">🔑 Licencia</span>
                                        </template>
                                        <template x-if="product.is_new">
                                            <span class="text-[8px] font-black uppercase bg-[#FF2121] text-white px-2 py-0.5 border border-[#1c1c22] shadow">✨ Novedad</span>
                                        </template>
                                    </div>
                                </div>

                                <div class="flex items-start justify-between gap-4 mb-2">
                                    <h3 class="text-white font-extrabold text-base leading-snug line-clamp-1" x-text="product.name"></h3>
                                    <span class="text-[9px] px-2 py-0.5 bg-[#1c1c22] border border-white/10 text-white font-mono shrink-0" x-text="'v' + product.version"></span>
                                </div>
                                <p class="text-gray-400 text-xs leading-relaxed mb-6 font-semibold line-clamp-2" x-text="product.desc"></p>
                            </div>

                            <div>
                                <!-- Flat styled activation link -->
                                <template x-if="product.is_license">
                                    <div class="mb-5 p-3.5 bg-amber-500/5 border-2 border-amber-500/20 flex flex-col gap-2">
                                        <span class="text-[9px] font-black text-amber-500 flex items-center gap-1 uppercase tracking-wider">
                                            🔑 Activación Core Requerida
                                        </span>
                                        <a href="#" @click.prevent="toast('redirection', 'Abriendo pestaña de tickets...')" class="py-2 bg-amber-500 hover:bg-amber-600 text-black text-[9px] font-black uppercase tracking-widest text-center transition-all block border-2 border-black">
                                            Solicitar Activación
                                        </a>
                                    </div>
                                </template>

                                <!-- Buttons -->
                                <div class="flex gap-3">
                                    <button @click="install(product)" :disabled="product.installing || product.installed" :class="product.installed ? 'bg-[#10b981] text-black border-2 border-[#1c1c22]' : 'bg-[#FF2121] text-white border-2 border-[#1c1c22]'" class="bauhaus-button flex-1 py-3 font-black text-xs uppercase tracking-widest flex items-center justify-center gap-1.5 transition-all">
                                        <span x-text="product.installed ? '¡Instalado!' : (product.installing ? 'Instalando...' : 'Instalar')"></span>
                                    </button>
                                    <button @click="downloadZip(product)" class="bauhaus-button px-4 bg-zinc-900 text-white border-2 border-[#1c1c22] hover:bg-[#1c1c22] transition-all" title="ZIP">
                                        <i class="fas fa-file-zipper"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Empty state fallback -->
                <div x-show="filteredProducts().length === 0" class="py-24 text-center bg-zinc-950/20 border border-white/5 rounded-3xl max-w-md mx-auto">
                    <i class="fas fa-folder-open text-gray-700 text-4xl mb-4"></i>
                    <p class="text-gray-400 font-bold text-sm">No se encontraron productos con estos filtros.</p>
                </div>

            </div>
        </div>
    </div>

    <!-- Live Demo Script -->
    <script>
        function pluginDemo() {
            return {
                layoutMode: 'grid',
                filterTab: 'all',
                searchQuery: '',
                toasts: [],
                products: [
                    {
                        id: 70,
                        name: 'WoodMart – Multipurpose WooCommerce Theme',
                        type: 'Theme',
                        version: '3.0.3',
                        desc: 'WoodMart is a premium WooCommerce theme optimized for creating professional online stores with modern elements.',
                        image: 'https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500&auto=format&fit=crop&q=60',
                        is_license: true,
                        is_new: false,
                        installing: false,
                        installed: false
                    },
                    {
                        id: 69,
                        name: 'Easy Table of Contents Pro',
                        type: 'Plugin',
                        version: '1.0.37',

                filteredProducts() {
                    return this.products.filter(p => {
                        // Search filter
                        if (this.searchQuery && !p.name.toLowerCase().includes(this.searchQuery.toLowerCase())) {
                            return false;
                        }
                        
                        // Tab filters
                        if (this.filterTab === 'licenses') return p.is_license;
                        if (this.filterTab === 'news') return p.is_new;
                        if (this.filterTab === 'plugins') return p.type.toLowerCase() === 'plugin';
                        if (this.filterTab === 'themes') return p.type.toLowerCase() === 'theme';
                        
                        return true;
                    });
                },
                
                install(product) {
                    product.installing = true;
                    this.toast('success', 'Instalando ' + product.name + ' en WordPress...');
                    
                    setTimeout(() => {
                        product.installing = false;
                        product.installed = true;
                        this.toast('success', '¡' + product.name + ' se instaló correctamente!');
                    }, 2000);
                },
                
                downloadZip(product) {
                    this.toast('success', 'Descargando paquete ZIP de ' + product.name + '...');
                },
                
                toast(type, message) {
                    const id = Date.now();
                    this.toasts.push({ id, type, message });
                    
                    setTimeout(() => {
                        this.toasts = this.toasts.filter(t => t.id !== id);
                    }, 3500);
                }
            }
        }
    </script>
